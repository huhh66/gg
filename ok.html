<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Jakerste</title>
</head>
<body>
<h1>正在开发中,请稍后,谢谢</h1>
<button onclick="playVideo()" style="background-color:#008822;color:white;padding:8px 16px;font-size:14px;border:none;border-radius:2px;width:140px;height:36px;box-sizing:border-box;">点击播放视频</button>
<button onclick="openAiPage()" style="background-color:#008822;color:white;padding:8px 16px;font-size:14px;border:none;border-radius:2px;width:140px;height:36px;box-sizing:border-box;">AI</button>
<video id="myVideo" style="display:none" controls>
<source src="doubao.mp4" type="video/mp4">
</video>

<script>
const v=document.getElementById('myVideo');
function playVideo(){
  v.style.display='block';
  this.style.display='none';
  v.play();
}
v.onended=()=>{
  v.style.display='none';
  document.querySelector('button').style.display='block';
}

function openAiPage(){
  let currentLang = "zh";
  // 100+ 语言列表，[语言代码, 中文名称, English Name]
  const langList = [
    ["zh","中文","Chinese"],
    ["en","英语","English"],
    ["ko","韩语","Korean"],
    ["ja","日语","Japanese"],
    ["ar","阿拉伯语","Arabic"],
    ["es","西班牙语","Spanish"],
    ["fr","法语","French"],
    ["de","德语","German"],
    ["ru","俄语","Russian"],
    ["pt","葡萄牙语","Portuguese"],
    ["it","意大利语","Italian"],
    ["nl","荷兰语","Dutch"],
    ["sv","瑞典语","Swedish"],
    ["pl","波兰语","Polish"],
    ["tr","土耳其语","Turkish"],
    ["vi","越南语","Vietnamese"],
    ["th","泰语","Thai"],
    ["id","印尼语","Indonesian"],
    ["ms","马来语","Malay"],
    ["hi","印地语","Hindi"],
    ["ur","乌尔都语","Urdu"],
    ["fa","波斯语","Persian"],
    ["he","希伯来语","Hebrew"],
    ["el","希腊语","Greek"],
    ["cs","捷克语","Czech"],
    ["hu","匈牙利语","Hungarian"],
    ["ro","罗马尼亚语","Romanian"],
    ["uk","乌克兰语","Ukrainian"],
    ["be","白俄罗斯语","Belarusian"],
    ["bg","保加利亚语","Bulgarian"],
    ["hr","克罗地亚语","Croatian"],
    ["sr","塞尔维亚语","Serbian"],
    ["sk","斯洛伐克语","Slovak"],
    ["sl","斯洛文尼亚语","Slovenian"],
    ["et","爱沙尼亚语","Estonian"],
    ["lv","拉脱维亚语","Latvian"],
    ["lt","立陶宛语","Lithuanian"],
    ["fi","芬兰语","Finnish"],
    ["da","丹麦语","Danish"],
    ["no","挪威语","Norwegian"],
    ["is","冰岛语","Icelandic"],
    ["ga","爱尔兰语","Irish"],
    ["cy","威尔士语","Welsh"],
    ["mt","马耳他语","Maltese"],
    ["sq","阿尔巴尼亚语","Albanian"],
    ["mk","马其顿语","Macedonian"],
    ["ka","格鲁吉亚语","Georgian"],
    ["hy","亚美尼亚语","Armenian"],
    ["az","阿塞拜疆语","Azerbaijani"],
    ["kk","哈萨克语","Kazakh"],
    ["uz","乌兹别克语","Uzbek"],
    ["tk","土库曼语","Turkmen"],
    ["ky","吉尔吉斯语","Kyrgyz"],
    ["tg","塔吉克语","Tajik"],
    ["mn","蒙古语","Mongolian"],
    ["ne","尼泊尔语","Nepali"],
    ["si","僧伽罗语","Sinhala"],
    ["bn","孟加拉语","Bengali"],
    ["ta","泰米尔语","Tamil"],
    ["te","泰卢固语","Telugu"],
    ["mr","马拉地语","Marathi"],
    ["gu","古吉拉特语","Gujarati"],
    ["kn","卡纳达语","Kannada"],
    ["ml","马拉雅拉姆语","Malayalam"],
    ["pa","旁遮普语","Punjabi"],
    ["or","奥里亚语","Odia"],
    ["my","缅甸语","Burmese"],
    ["km","高棉语","Khmer"],
    ["lo","老挝语","Lao"],
    ["bo","藏语","Tibetan"],
    ["ug","维吾尔语","Uyghur"],
    ["yi","彝语","Yi"],
    ["ha","豪萨语","Hausa"],
    ["yo","约鲁巴语","Yoruba"],
    ["ig","伊博语","Igbo"],
    ["sw","斯瓦希里语","Swahili"],
    ["am","阿姆哈拉语","Amharic"],
    ["so","索马里语","Somali"],
    ["af","南非荷兰语","Afrikaans"],
    ["zu","祖鲁语","Zulu"],
    ["xh","科萨语","Xhosa"],
    ["eo","世界语","Esperanto"],
    ["la","拉丁语","Latin"],
    ["sa","梵语","Sanskrit"],
    ["haw","夏威夷语","Hawaiian"],
    ["mi","毛利语","Maori"],
    ["sm","萨摩亚语","Samoan"],
    ["to","汤加语","Tongan"],
    ["fj","斐济语","Fijian"],
    ["cr","克里语","Cree"],
    ["oj","奥吉布瓦语","Ojibwe"],
    ["nv","纳瓦霍语","Navajo"],
    ["kl","格陵兰语","Greenlandic"],
    ["se","北萨米语","Northern Sami"],
    ["ps","普什图语","Pashto"],
    ["sd","信德语","Sindhi"],
    ["lb","卢森堡语","Luxembourgish"],
    ["gd","苏格兰盖尔语","Scottish Gaelic"],
    ["br","布列塔尼语","Breton"],
    ["eu","巴斯克语","Basque"],
    ["ca","加泰罗尼亚语","Catalan"],
    ["oc","奥克语","Occitan"],
    ["gl","加利西亚语","Galician"]
  ];

  const aiModal = document.createElement('div');
  aiModal.style = `
    position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);
    display:flex;align-items:center;justify-content:center;z-index:999;
  `;
  aiModal.id = "aiModal";

  const aiPanel = document.createElement('div');
  aiPanel.style = `
    width:700px;height:500px;background:#fff;padding:15px;box-sizing:border-box;
    display:flex;flex-direction:column;font-family:SimHei, sans-serif;position:relative;
  `;

  // 自定义语言选择组件，右上角按钮，点击弹出下拉面板（面板内部自带搜索框）
  const langBtn = document.createElement('button');
  langBtn.style = `position:absolute;top:8px;right:8px;padding:3px 6px;font-size:12px;z-index:10;`;
  // 显示当前选中语言
  function updateLangBtnText(){
    const findLang = langList.find(i=>i[0] === currentLang);
    langBtn.innerText = findLang ? findLang[1] : "中文";
  }
  updateLangBtnText();

  let langDropdownPanel = null;
  // 点击按钮，创建下拉面板（搜索框放在面板最上方）
  langBtn.onclick = function(){
    if(langDropdownPanel){
      langDropdownPanel.remove();
      langDropdownPanel = null;
      return;
    }
    // 创建悬浮下拉面板
    langDropdownPanel = document.createElement('div');
    langDropdownPanel.style = `
      position:absolute;top:28px;right:0px;width:220px;background:#fff;border:1px solid #ccc;
      box-shadow:0 2px 8px #00000026;z-index:11;padding:6px;box-sizing:border-box;
    `;
    // 搜索框，放在下拉面板内部顶部
    const searchInput = document.createElement('input');
    searchInput.placeholder="搜索语言(中文/英文)";
    searchInput.style=`width:100%;box-sizing:border-box;padding:4px;font-size:12px;margin-bottom:6px;`;

    // 语言列表容器
    const listWrap = document.createElement('div');
    listWrap.style=`height:260px;overflow-y:auto;`;

    // 渲染语言列表函数
    function renderList(filter=""){
      listWrap.innerHTML = "";
      const ft = filter.toLowerCase();
      const filtered = langList.filter(item=>{
        const [code,cn,en]=item;
        return cn.toLowerCase().includes(ft) || en.toLowerCase().includes(ft);
      })
      filtered.forEach(([code,cn,en])=>{
        const itemDiv = document.createElement('div');
        itemDiv.style=`padding:4px 6px;cursor:pointer;font-size:12px;`;
        if(code === currentLang) itemDiv.style.background="#e8f0fe";
        itemDiv.innerText = `${cn} (${en})`;
        itemDiv.onclick = function(){
          currentLang = code;
          updateLangBtnText();
          langDropdownPanel.remove();
          langDropdownPanel=null;
        }
        listWrap.appendChild(itemDiv);
      })
    }
    renderList();
    // 搜索输入过滤
    searchInput.oninput = function(){
      renderList(this.value);
    }
    // 构建面板
    langDropdownPanel.appendChild(searchInput);
    langDropdownPanel.appendChild(listWrap);
    aiPanel.appendChild(langDropdownPanel);
    // 自动聚焦搜索框
    searchInput.focus();
  }
  aiPanel.appendChild(langBtn);

  const chatBox = document.createElement('textarea');
  chatBox.style = `flex:1;font-size:14px;margin-bottom:10px;resize:none;margin-top:35px;`;
  chatBox.readOnly = true;

  const bottomBar = document.createElement('div');
  bottomBar.style = `display:flex;gap:10px;`;

  const inputBox = document.createElement('input');
  inputBox.style = `flex:1;font-size:14px;padding:4px;`;

  const sendBtn = document.createElement('button');
  sendBtn.innerText = "发送";

  const exitBtn = document.createElement('button');
  exitBtn.innerText = "退出";
  exitBtn.onclick = function(){
    aiModal.remove();
  }

  bottomBar.appendChild(inputBox);
  bottomBar.appendChild(sendBtn);
  bottomBar.appendChild(exitBtn);

  aiPanel.appendChild(chatBox);
  aiPanel.appendChild(bottomBar);
  aiModal.appendChild(aiPanel);
  document.body.appendChild(aiModal);


  sendBtn.onclick = async function(){
    const msg = inputBox.value.trim();
    if(!msg) return;
    chatBox.value += `你：${msg}\n`;
    chatBox.value += `AI：正在思考中`;
    chatBox.scrollTop = chatBox.scrollHeight;
    inputBox.value = "";

    let dotCount = 0;
    let thinkingTimer = null;
    function startDotAnimation(){
      thinkingTimer = setInterval(()=>{
        dotCount++;
        if(dotCount>3){
          dotCount = 0;
          chatBox.value = chatBox.value.replace(/正在思考中\.*/,"正在思考中");
        }else{
          chatBox.value = chatBox.value.replace(/正在思考中\.*/,"正在思考中"+".".repeat(dotCount));
        }
        chatBox.scrollTop = chatBox.scrollHeight;
      },200);
    }
    startDotAnimation();

    try{
        const api_key = "7f056634d53c4c53a4015a96f6d02401.3X1kbDBgrHZDsws2";
        const model = "glm-5.3-flash";
        const url = "https://open.bigmodel.cn/api/paas/v4/chat/completions";

        const system_prompt = `
你是Hackjoy。
规则：
识别用户输入，支持100+种人类语言。
只要用户意图是【问候】，或者【询问你的名字 / 你是谁】，无论任何语言，强制只输出对应语言这句话：我是Jakerste开发的AI
除此之外，**全程必须只使用【${currentLang}】语言回答用户问题，禁止使用其他语言，不要夹杂中文**。
⚠️ 如果命中上面规则，禁止增加额外文字，只能输出对应翻译版本：我是Jakerste开发的AI
        `;

        const resp = await fetch(url, {
            method:"POST",
            headers:{
                "Authorization":`Bearer ${api_key}`,
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                model:model,
                messages:[
                    {"role":"system","content":system_prompt},
                    {"role":"user","content":msg}
                ]
            })
        })
        const data = await resp.json();
        clearInterval(thinkingTimer);
        const reply = data.choices[0].message.content;
        chatBox.value = chatBox.value.replace(/正在思考中\.*/, reply+"\n");
        chatBox.scrollTop = chatBox.scrollHeight;
    }catch(err){
        clearInterval(thinkingTimer);
        chatBox.value = chatBox.value.replace(/正在思考中\.*/, "网络请求出错，请稍后重试\n");
        chatBox.scrollTop = chatBox.scrollHeight;
        console.error(err);
    }
  }

  // 回车发送消息
  inputBox.onkeydown = function(e){
    if(e.key === 'Enter'){
      sendBtn.click();
    }
  }
}
</script>
</body>
</html>
